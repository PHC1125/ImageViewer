<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Cards Showcase</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2a2a2a;
            --secondary: #ffffff;
            --accent: #4a90e2;
            --shadow: rgba(0, 0, 0, 0.1);
            --card-bg: #ffffff;
        }

        .dark-mode {
            --primary: #ffffff;
            --secondary: #1a1a1a;
            --accent: #64b5f6;
            --shadow: rgba(255, 255, 255, 0.1);
            --card-bg: #2a2a2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--secondary);
            color: var(--primary);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .title {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, var(--accent), #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleFloat 3s ease-in-out infinite;
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .theme-toggle {
            position: absolute;
            right: 2rem;
            top: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--primary);
            padding: 0.5rem;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .theme-toggle:hover {
            transform: rotate(180deg);
        }

        .carousel-container {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 20px 20px 60px var(--shadow),
                       -20px -20px 60px var(--shadow);
        }

        .carousel {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .carousel-item {
            min-width: 100%;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .carousel-item img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 1rem;
        }

        .nav-button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 1rem;
            cursor: pointer;
            border-radius: 50%;
            backdrop-filter: blur(5px);
            transition: background-color 0.3s;
        }

        .nav-button:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 10px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            background: none;
            border: none;
        }

        .dots-container {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
            margin: 0 5px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .dot.active {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .title {
                font-size: 2rem;
            }

            .carousel-item img {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="title">Game Cards Showcase</h1>
            <button class="theme-toggle" id="themeToggle">
                <i class='bx bx-moon'></i>
            </button>
        </header>

        <div class="carousel-container">
            <div class="carousel" id="carousel">
                <!-- Images will be dynamically loaded here -->
            </div>

            <div class="carousel-nav">
                <button class="nav-button prev">
                    <i class='bx bx-chevron-left'></i>
                </button>
                <button class="nav-button next">
                    <i class='bx bx-chevron-right'></i>
                </button>
            </div>
        </div>

        <div class="dots-container" id="dots">
            <!-- Dots will be dynamically added here -->
        </div>
    </div>

    <div class="modal" id="modal">
        <button class="modal-close">×</button>
        <img src="" alt="Enlarged card" id="modalImage">
    </div>

    <script>
        // Simulate loading images from the 'cards' directory
        const images = [
            'https://picsum.photos/800/400?random=1',
            'https://picsum.photos/800/400?random=2',
            'https://picsum.photos/800/400?random=3',
            'https://picsum.photos/800/400?random=4',
            'https://picsum.photos/800/400?random=5'
        ];

        const carousel = document.getElementById('carousel');
        const dotsContainer = document.getElementById('dots');
        const modal = document.getElementById('modal');
        const modalImage = document.getElementById('modalImage');
        const themeToggle = document.getElementById('themeToggle');
        let currentIndex = 0;

        // Load images and create carousel items
        images.forEach((src, index) => {
            const item = document.createElement('div');
            item.className = 'carousel-item';
            
            const img = document.createElement('img');
            img.src = src;
            img.alt = `Game Card ${index + 1}`;
            
            item.appendChild(img);
            carousel.appendChild(item);

            // Create dots
            const dot = document.createElement('div');
            dot.className = `dot ${index === 0 ? 'active' : ''}`;
            dot.addEventListener('click', () => goToSlide(index));
            dotsContainer.appendChild(dot);
        });

        // Navigation functions
        function updateCarousel() {
            carousel.style.transform = `translateX(-${currentIndex * 100}%)`;
            document.querySelectorAll('.dot').forEach((dot, index) => {
                dot.classList.toggle('active', index === currentIndex);
            });
        }

        function goToSlide(index) {
            currentIndex = index;
            updateCarousel();
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % images.length;
            updateCarousel();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            updateCarousel();
        }

        // Event listeners
        document.querySelector('.next').addEventListener('click', nextSlide);
        document.querySelector('.prev').addEventListener('click', prevSlide);

        // Click to enlarge
        carousel.addEventListener('click', (e) => {
            if (e.target.tagName === 'IMG') {
                modal.style.display = 'flex';
                modalImage.src = e.target.src;
            }
        });

        // Close modal
        modal.addEventListener('click', (e) => {
            if (e.target !== modalImage) {
                modal.style.display = 'none';
            }
        });

        // Theme toggle
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            themeToggle.innerHTML = document.body.classList.contains('dark-mode') 
                ? '<i class="bx bx-sun"></i>' 
                : '<i class="bx bx-moon"></i>';
        });

        // Auto-play carousel
        setInterval(nextSlide, 5000);

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevSlide();
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'Escape' && modal.style.display === 'flex') {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
